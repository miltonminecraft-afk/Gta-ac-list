plugins { id 'com.android.application' }
android {
    namespace 'nl.gtaac.governor'
    compileSdk 35
    defaultConfig {
        applicationId 'nl.gtaac.governor'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'nl.gtaac.governor.GovernorInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
