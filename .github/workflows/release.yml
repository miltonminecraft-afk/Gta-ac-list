name: Ondertekende Android-app publiceren
on:
  push:
    branches: [main]
    paths: ['dist/GTA-AC-Governor.apk']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Handtekening en checksum controleren
        run: |
          sdkmanager 'build-tools;35.0.0'
          cd dist
          sha256sum -c SHA256SUMS
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs GTA-AC-Governor.apk | tee signature.txt
          grep -F -f certificate-sha256.txt signature.txt
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 dist/GTA-AC-Governor.apk dist/SHA256SUMS --title 'GTA AC Governor 1.0.0' --notes-file dist/RELEASE-NOTES.md --target "$GITHUB_SHA"
