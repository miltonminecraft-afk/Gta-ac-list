name: Android bouwen en controleren
on:
  push:
    branches: [main]
    paths: ['app/**', '*.gradle', 'gradle.properties', 'tests/**', 'scripts/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: SDK
        # Ubuntu images change; provision the SDK explicitly.
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Privacycontrole
        run: python -m unittest discover -s tests -p '*_test.py'
      - name: Build en lint
        run: gradle --no-daemon :app:assembleRelease :app:assembleDebug :app:assembleAndroidTest :app:lintRelease
      - name: Bouwbestanden verzamelen
        run: |
          mkdir -p build-artifact
          cp app/build/outputs/apk/release/app-release-unsigned.apk build-artifact/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-artifact/
          cp app/build/reports/lint-results-release.html build-artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: governor-unsigned
          path: build-artifact/
          retention-days: 7
      - name: KVM voor apparaattest
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w nl.gtaac.governor.test/nl.gtaac.governor.GovernorInstrumentation | tee instrumentation.txt
            adb logcat -d > android-logcat.txt
            adb logcat -d -b crash | tee android-crash.txt
            adb exec-out screencap -p > android-screen.png
            grep -q 'OK (' instrumentation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            instrumentation.txt
            android-logcat.txt
            android-crash.txt
            android-screen.png

